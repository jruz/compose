when:
  - event: tag

steps:
  - name: BUILD
    image: bash
    environment:
      REVISION: ${CI_COMMIT_SHA}
    commands:
      - just release-build-linux
      - just release-build-macos

  - name: RELEASE
    image: bash
    environment:
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
    commands:
      - nix develop --command just release-upload ${CI_COMMIT_TAG}
