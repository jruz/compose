when:
  - event: tag

steps:
  - name: BUILD_LINUX
    image: ghcr.io/rust-cross/cargo-zigbuild:0.21.4
    environment:
      REVISION: $${CI_COMMIT_SHA}
    commands:
      - rustup target add x86_64-unknown-linux-gnu
      - rustup target add aarch64-unknown-linux-gnu
      - cargo zigbuild --release --target x86_64-unknown-linux-gnu
      - cargo zigbuild --release --target aarch64-unknown-linux-gnu
      - cp target/x86_64-unknown-linux-gnu/release/compose compose-linux-x86_64
      - cp target/aarch64-unknown-linux-gnu/release/compose compose-linux-arm64

  - name: BUILD_MACOS
    image: ghcr.io/rust-cross/cargo-zigbuild:0.21.4
    environment:
      REVISION: $${CI_COMMIT_SHA}
    commands:
      - rustup target add x86_64-apple-darwin
      - rustup target add aarch64-apple-darwin
      - cargo zigbuild --release --target x86_64-apple-darwin
      - cargo zigbuild --release --target aarch64-apple-darwin
      - cp target/x86_64-apple-darwin/release/compose compose-macos-x86_64
      - cp target/aarch64-apple-darwin/release/compose compose-macos-arm64

  - name: RELEASE
    image: 127.0.0.1:5000/woodpecker-job:v0.0.15
    environment:
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
    commands:
      - ls -la compose-*
      - . /entrypoint.sh
      - nix develop --command just release-upload $${CI_COMMIT_TAG}
