when:
  - event: tag

steps:
  - name: BUILD_LINUX
    image: bash
    environment:
      REVISION: ${CI_COMMIT_SHA}
    commands:
      - nix develop --command scripts/release-build.sh unknown-linux-musl x86_64
      - nix develop --command scripts/release-build.sh unknown-linux-musl aarch64

  - name: BUILD_MACOS
    image: bash
    environment:
      REVISION: ${CI_COMMIT_SHA}
    commands:
      - nix develop --command scripts/release-build.sh apple-darwin x86_64
      - nix develop --command scripts/release-build.sh apple-darwin aarch64

  - name: RELEASE
    image: bash
    environment:
      CODEBERG_TOKEN:
        from_secret: CODEBERG_TOKEN
    commands:
      - ls -la ${CI_REPO_NAME}-*
      - nix develop --command just release-upload ${CI_COMMIT_TAG}
