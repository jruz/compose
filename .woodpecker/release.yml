when:
  - event: tag

steps:
  - name: BUILD
    image: bash
    environment:
      REVISION: ${CI_COMMIT_SHA}
    commands:
      - nix develop --command just release-build-all

  - name: RELEASE
    image: bash
    environment:
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - ls -la ${CI_REPO_NAME}-*
      - nix develop --command just release-upload ${CI_COMMIT_TAG}
