processes:
  postgres:
    docker:
      image: postgres:16-alpine
      ports:
        - "${PG_HOST_PORT}:5432"
      volumes:
        - "${PG_DATA}:/var/lib/postgresql/data"
    env:
      PG_HOST_PORT: "5432"
      PG_USER: postgres
      PG_DATA: /tmp/compose-pg-data
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: app
    health:
      command: "pg_isready -U ${PG_USER}"
      interval_secs: 1
      timeout_secs: 10

  redis:
    docker:
      image: redis:7-alpine
      ports:
        - "${REDIS_HOST_PORT}:6379"
    env:
      REDIS_HOST_PORT: "6379"
      REDIS_PORT: "6379"
    health:
      exec: ["redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval_secs: 1
      timeout_secs: 5

  api:
    docker:
      image: nginx:alpine
      ports:
        - "${API_HOST_PORT}:80"
    env:
      API_HOST_PORT: "18080"
      API_MSG: compose-interpolation-works
    exec: ["sh", "-c", "echo ${API_MSG} && exec nginx -g 'daemon off;'"]
    depends_on: [postgres, redis]
