services:
  postgres:
    docker:
      image: postgres:16-alpine
      run:
        publish:
          - "5432:5432"
    environment:
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: app
    healthcheck:
      test: [sh, -c, "pg_isready -U postgres"]
      interval_secs: 1
      timeout_secs: 10

  redis:
    docker:
      image: redis:7-alpine
      run:
        publish:
          - "6379:6379"
    healthcheck:
      test: [sh, -c, "redis-cli ping"]
      interval_secs: 1
      timeout_secs: 5

  api:
    docker:
      image: nginx:alpine
      run:
        publish:
          - "8080:80"
    depends_on: [postgres, redis]
