services:
  postgres:
    command: bun run examples/services/postgres.ts
    healthcheck:
      test: [sh, -c, "curl -sf http://localhost:5555/health"]
      interval_secs: 1
      timeout_secs: 5

  redis:
    command: bun run examples/services/redis.ts
    healthcheck:
      test: [sh, -c, "curl -sf http://localhost:6555/health"]
      interval_secs: 1
      timeout_secs: 5

  worker:
    command: bun run examples/services/worker.ts
    depends_on: [postgres, redis]

  api:
    command: bun run examples/services/api.ts
    depends_on: [postgres, redis]
    healthcheck:
      test: [sh, -c, "curl -sf http://localhost:8555/health"]
      interval_secs: 1
      timeout_secs: 5
