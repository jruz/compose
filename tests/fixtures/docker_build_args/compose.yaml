services:
  omitted:
    type: oneshot
    docker:
      build:
        context: ./app
    env_file: service.env
    environment:
      GREETING: not-forwarded
  empty:
    type: oneshot
    depends_on: [omitted]
    docker:
      build:
        context: ./app
        args: {}
    env_file: service.env
    environment:
      GREETING: not-forwarded
  listed:
    type: oneshot
    depends_on: [empty]
    docker:
      build:
        context: ./app
        args: [GREETING, 'EXTRA=literal value']
    env_file: service.env
    environment:
      GREETING: ignored-for-bare-name
  build-args-main:
    depends_on: [listed]
    docker:
      image: "${IMAGE_NAME}:1"
      build:
        context: "${BUILD_CONTEXT}"
        dockerfile: "${BUILD_FILE}"
        args:
          GREETING: "${GREETING} / ${SERVICE_VALUE} / ${CLI_VALUE} / ${HOST_VALUE}"
      run:
        workdir: "${WORKDIR}"
        read-only: true
        tmpfs:
          - "${WORKDIR}"
          - /second
    command: ["sh", "-ec", "touch write-check /second/write-check; pwd; cat /greeting.txt"]
    env_file: service.env
    environment:
      BUILD_CONTEXT: ./app
      BUILD_FILE: app/Dockerfile
      GREETING: from-inline
      IMAGE_NAME: compose-test-build-args
      WORKDIR: /first
