services:
  implicit:
    type: oneshot
    docker:
      build:
        context: ./app
    environment:
      GREETING: implicit-from-env
  empty:
    type: oneshot
    depends_on: [implicit]
    docker:
      build:
        context: ./app
        args: {}
    environment:
      GREETING: not-forwarded
  build-args-main:
    depends_on: [empty]
    docker:
      image: "${IMAGE_NAME}:1"
      build:
        context: "${BUILD_CONTEXT}"
        dockerfile: "${BUILD_FILE}"
        args:
          GREETING: "${MESSAGE}"
      run:
        workdir: "${WORKDIR}"
        read-only: true
        tmpfs:
          - "${WORKDIR}"
          - /second
    command: ["sh", "-ec", "touch write-check /second/write-check; pwd; cat /greeting.txt"]
    environment:
      BUILD_CONTEXT: ./app
      BUILD_FILE: app/Dockerfile
      GREETING: overridden
      IMAGE_NAME: compose-test-build-args
      MESSAGE: hello from build arg
      WORKDIR: /first
