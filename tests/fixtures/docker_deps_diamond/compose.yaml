processes:
  diamond-db:
    docker:
      image: compose-test-diamond-db
      build: ./db
    health:
      command: "true"
      interval_secs: 1
      timeout_secs: 10

  diamond-cache:
    docker:
      image: compose-test-diamond-cache
      build: ./cache
    health:
      command: "true"
      interval_secs: 1
      timeout_secs: 10

  diamond-app:
    docker:
      image: compose-test-diamond-app
      build: ./app
    depends_on: [diamond-db, diamond-cache]
