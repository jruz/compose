services:
  dns-server:
    docker:
      image: compose-test-dns-server:1
      build:
        context: ./server
    healthcheck:
      test: [sh, -c, "true"]
      interval_secs: 1
      timeout_secs: 10

  dns-client:
    docker:
      image: compose-test-dns-client:1
      build:
        context: ./client
    depends_on: [dns-server]
