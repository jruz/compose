env_file: ../env_precedence_shared.env
services:
  env-bg:
    docker:
      image: compose-test-env-bg:1
      build:
        context: ./bg

  env-main:
    docker:
      image: compose-test-env-main:1
      build:
        context: ./main
    command: [sh, -c, 'echo MY_VAR="$MY_VAR" OTHER_VAR="$OTHER_VAR" MANIFEST_ONLY="$MANIFEST_ONLY" SHARED="$SHARED"']
    environment:
      SHARED: "from-inline"
      MY_VAR: "hello-from-env"
      OTHER_VAR: "42"
