processes:
  hc-service:
    docker:
      image: compose-test-hc-service
      build: ./service
    health:
      exec: ["cat", "/tmp/healthy"]
      interval_secs: 1
      timeout_secs: 10

  hc-consumer:
    docker:
      image: compose-test-hc-consumer
      build: ./consumer
    depends_on: [hc-service]
