services:
  hc-service:
    docker:
      image: compose-test-hc-service:1
      build:
        context: ./service
    healthcheck:
      test: [sh, -c, "cat /tmp/healthy && echo ok"]
      interval_secs: 1
      timeout_secs: 10

  hc-consumer:
    docker:
      image: compose-test-hc-consumer:1
      build:
        context: ./consumer
    depends_on: [hc-service]
