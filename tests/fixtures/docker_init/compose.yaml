services:
  enabled:
    type: oneshot
    docker:
      image: alpine:3.21
      run:
        init: true
    command: ["sh", "-c", "test \"$$\" -ne 1 && echo init-enabled"]

  disabled:
    type: oneshot
    depends_on: [enabled]
    docker:
      image: alpine:3.21
      run:
        init: false
    command: ["sh", "-c", "test \"$$\" -eq 1 && echo init-disabled"]

  omitted:
    depends_on: [disabled]
    docker:
      image: alpine:3.21
    command: ["sh", "-c", "test \"$$\" -eq 1 && echo init-omitted"]
