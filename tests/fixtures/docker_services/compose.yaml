services:
  svc-server:
    docker:
      image: compose-test-svc-server:1
      build:
        context: ./server
    healthcheck:
      test: [sh, -c, "true"]
      interval_secs: 1
      timeout_secs: 10

  svc-client:
    docker:
      image: compose-test-svc-client:1
      build:
        context: ./client
    depends_on: [svc-server]
