processes:
  service:
    command: '(sleep 2 && touch "${MARKER}") & echo service-started && exec sleep 10'
    env:
      MARKER: "${COMPOSE_TEST_MARKER}"
    health:
      command: 'test -f "${MARKER}" && rm "${MARKER}"'
      interval_secs: 1
      timeout_secs: 5

  consumer:
    command: "echo consumer-started && exit 0"
    depends_on: [service]
