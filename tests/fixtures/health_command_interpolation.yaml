processes:
  service:
    command: 'touch "${MARKER}" && exec sleep 10'
    env:
      MARKER: "${COMPOSE_TEST_MARKER}"
    health:
      command: 'test -f "${MARKER}"'
      interval_secs: 1
      timeout_secs: 3

  consumer:
    command: "echo consumer-started && exit 0"
    depends_on: [service]
