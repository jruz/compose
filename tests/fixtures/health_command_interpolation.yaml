services:
  service:
    command: 'touch "${MARKER}" && exec sleep 10'
    environment:
      MARKER: "${COMPOSE_TEST_MARKER}"
    healthcheck:
      test: [sh, -c, 'test -f "${MARKER}"']
      interval_secs: 1
      timeout_secs: 3

  consumer:
    command: "echo consumer-started && exit 0"
    depends_on: [service]
